name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-and-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install Site Dependencies
        run: npm --prefix site ci

      - name: Sync Python Dependencies
        run: uv sync --dev

      - name: Run Ruff Linter & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Mypy & TypeScript Static Type Checkers
        run: |
          uv run mypy rag_pipeline tests
          npm --prefix site run typecheck

      - name: Run Bandit Security Scan
        run: uv run bandit -c pyproject.toml -r rag_pipeline

      - name: Run Python & NPM Dependency Vulnerability Scans
        run: |
          uv run pip-audit
          npm --prefix site audit --audit-level=moderate

      - name: Run detect-secrets Check
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files | grep -vE 'site/package-lock.json|uv.lock')

      - name: Run Pytest with Coverage Gate
        run: uv run pytest

      - name: Run Trivy Filesystem Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
