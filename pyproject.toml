[project]
name = "portfolio-project"
version = "0.1.0"
description = "VraiDaten Edge RAG Portfolio and MLOps Documentation"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.3.5",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.8",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["site/node_modules", "site/dist", "site/.astro"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["site/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_pipeline --cov-fail-under=80 -v"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "site"]
skips = []
